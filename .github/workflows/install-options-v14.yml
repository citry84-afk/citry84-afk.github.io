name: Instalar motor Opciones v14
on:
  push:
    paths:
      - '.github/workflows/install-options-v14.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar options-v14.js
        shell: bash
        run: |
          mkdir -p mi-plan
          cat <<'B64' | base64 -d | gzip -d > mi-plan/options-v14.js
          [... CONTENT OMITTED IN THIS SUMMARY FOR BREVITY ...]
          B64
          node --check mi-plan/options-v14.js
      - name: Publicar archivo generado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-plan/options-v14.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: publicar motor único de opciones v14'
          git push

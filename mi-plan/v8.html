<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082a5c"><title>Mi Plan — cargando versión compatible</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#f5f9ff,#eaf2ff);color:#082a5c}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);padding:30px;border-radius:28px;background:white;box-shadow:0 25px 80px rgba(8,42,92,.18);text-align:center}.logo{width:72px;height:72px;border-radius:50%;margin:auto;background:linear-gradient(145deg,#082a5c,#246fe5);display:grid;place-items:center;color:white;font-size:28px;font-weight:900}.spinner{width:42px;height:42px;border:4px solid #dfeaff;border-top-color:#ff7a16;border-radius:50%;margin:24px auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:24px;margin:16px 0 8px}p{color:#63748d;line-height:1.5;margin:0}.error{display:none;text-align:left}.error button{border:0;border-radius:15px;background:#ff7a16;color:#fff;font-weight:800;padding:13px 17px;font-size:15px;margin-top:18px}</style></head><body><main><div class="card" id="loading"><div class="logo">FF</div><h1>Preparando Mi Plan</h1><p>Cargando la versión compatible con Safari…</p><div class="spinner"></div></div><div class="card error" id="error"><h1>No se pudo abrir la aplicación</h1><p>Pulsa el botón para intentarlo de nuevo. Este mensaje sí se puede cerrar volviendo atrás.</p><button onclick="location.reload()">Volver a intentar</button></div></main><script>(async()=>{try{const response=await fetch('./index.html?release=8',{cache:'no-store'});if(!response.ok)throw new Error('No se pudo descargar la aplicación');let html=await response.text();html=html.replace('./portrait-v4-loader.js?v=4','./portrait-v4-loader.js?v=8');html=html.replace('</head>','<meta name="ff-release" content="8"></head>');document.open();document.write(html);document.close()}catch(error){console.error(error);document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block'}})();</script></body></html>

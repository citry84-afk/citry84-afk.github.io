<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f8ff">
  <meta name="ff-release" content="15.16-stable">
  <title>FinanzasFácil · Mi Plan</title>
  <style>
    :root{--navy:#082a5c;--navy2:#0e4b91;--orange:#ff8613;--blue:#1674d1;--ink:#0b2240;--muted:#65758a;--line:#d9e4ef;--bg:#f3f7fc;--panel:#fff;--good:#137a56;--warn:#a76508;--bad:#b3263d;--shadow:0 18px 55px rgba(8,42,92,.12)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#edf4ff 0,#f8fbff 45%,#f2f6fb 100%);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:88px;padding:16px 18px;background:rgba(255,255,255,.93);border-bottom:1px solid rgba(201,216,231,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--ink);text-align:left}.logo{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#000;color:#fff;font-size:13px;font-weight:950;letter-spacing:-.04em}.brand strong{display:block;font-size:22px;letter-spacing:-.04em}.brand small{display:block;margin-top:2px;color:var(--orange);font-size:15px;font-weight:850}
    .top-actions{display:flex;align-items:center;gap:8px}.icon-btn{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--navy);font-size:20px;font-weight:900;box-shadow:0 8px 20px rgba(8,42,92,.06)}.icon-btn.primary{border:0;background:linear-gradient(145deg,#ff9a22,#ff7b0b);color:#fff}
    main{width:min(1040px,100%);margin:0 auto;padding:22px 18px 116px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:5px 0 18px}.eyebrow{margin:0;color:#667a91;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.page-head h1{margin:7px 0 0;font-size:clamp(30px,7vw,46px);line-height:1.02;letter-spacing:-.055em}.page-head p{margin:8px 0 0;color:var(--muted);line-height:1.55}.date{color:#708299;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.13em}
    .hero{position:relative;overflow:hidden;padding:24px;border-radius:30px;background:radial-gradient(circle at 88% 8%,rgba(255,134,19,.32),transparent 29%),linear-gradient(145deg,#061d42,#0c3d7a 72%,#1359a9);color:#fff;box-shadow:0 28px 70px rgba(8,42,92,.23)}.hero:after{content:"";position:absolute;width:260px;height:260px;right:-110px;bottom:-150px;border-radius:50%;border:40px solid rgba(255,255,255,.06)}.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}.hero h2{margin:8px 0 9px;font-size:clamp(35px,8vw,62px);letter-spacing:-.06em}.hero p{margin:0;color:#c7d8ea;line-height:1.55}.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#dceafa;font-size:10px;font-weight:900}.hero-badge i{width:8px;height:8px;border-radius:50%;background:#45d39f}.ring{--p:60;display:grid;place-items:center;width:180px;height:180px;margin:auto;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),rgba(255,255,255,.14) 0);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.ring:before{content:"";grid-area:1/1;width:136px;height:136px;border-radius:50%;background:#0a2f64}.ring>div{position:relative;grid-area:1/1;text-align:center}.ring span{display:block;color:#b7cbe0;font-size:10px}.ring strong{display:block;margin:3px 0;font-size:44px}.ring small{color:#ffcca0}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.metric{padding:17px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 10px 28px rgba(8,42,92,.06)}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:800}.metric strong{display:block;margin-top:9px;font-size:23px;letter-spacing:-.04em}.metric small{display:block;margin-top:5px;color:#8191a5;font-size:9px;line-height:1.4}
    .section{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:25px;background:var(--panel);box-shadow:var(--shadow)}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.section-head h2{margin:0;font-size:22px;letter-spacing:-.035em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.soft-btn,.primary-btn,.danger-btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900}.soft-btn{border:1px solid var(--line);background:#f7faff;color:var(--navy)}.primary-btn{background:linear-gradient(145deg,#ff951f,#ff7908);color:#fff;box-shadow:0 10px 23px rgba(255,126,15,.2)}.danger-btn{background:#fff0f2;color:var(--bad)}
    .item-list{display:grid;gap:9px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:13px;border:1px solid #e2eaf3;border-radius:17px;background:#fbfdff}.item-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#eaf3ff;color:var(--blue);font-weight:950}.item b{display:block;font-size:13px}.item small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.item-value{text-align:right}.item-value strong{display:block;font-size:14px}.item-value button{margin-top:4px;border:0;background:transparent;color:var(--blue);font-size:10px;font-weight:850}
    .group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.group{padding:16px;border:1px solid var(--line);border-radius:20px;background:#fbfdff}.group-top{display:flex;justify-content:space-between;gap:9px}.group h3{margin:0;font-size:15px}.group strong{font-size:18px}.group p{margin:7px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
    .goal-card{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px;border-radius:24px;background:linear-gradient(145deg,#082a5c,#0c4a91);color:#fff}.goal-card h2{margin:5px 0 8px;font-size:28px}.goal-card p{margin:0;color:#bfd3e7}.goal-progress{width:100%;height:10px;margin-top:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.goal-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff9d28,#ff7710)}.goal-pct{font-size:45px;font-weight:950;letter-spacing:-.06em}
    .options-hero{padding:22px;border-radius:26px;background:linear-gradient(145deg,#071a32,#0d345f);color:#fff}.options-hero .file{color:#8fb2d6;font-size:10px}.options-hero h2{margin:8px 0 5px;font-size:30px}.options-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.option-kpi{padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.06)}.option-kpi span{display:block;color:#9fb9d2;font-size:9px}.option-kpi strong{display:block;margin-top:7px;font-size:21px}.notice{margin-top:12px;padding:13px;border-radius:16px;background:#fff7e9;color:#7c5112;font-size:11px;line-height:1.5}
    .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-card{padding:18px;border:1px solid var(--line);border-radius:20px;background:#fbfdff}.report-card span{color:var(--muted);font-size:10px}.report-card strong{display:block;margin-top:8px;font-size:24px}.movement{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f6}.movement:last-child{border:0}.movement b{display:block;font-size:12px}.movement small{color:var(--muted);font-size:9px}
    .bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:100;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:80px;padding:7px;border:1px solid rgba(170,190,211,.7);border-radius:26px;background:rgba(255,255,255,.96);box-shadow:0 18px 55px rgba(8,42,92,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.bottom-nav button{display:flex;min-width:0;height:64px;padding:6px 1px;border:0;border-radius:18px;background:transparent;color:#627187;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:850;touch-action:manipulation}.bottom-nav button span{font-size:20px;line-height:1}.bottom-nav button.active{background:#fff5e9;color:var(--orange)}
    .overlay{position:fixed;inset:0;z-index:200;display:grid;align-items:end;padding:10px;background:rgba(3,15,33,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.sheet{width:min(620px,100%);max-height:90dvh;margin:0 auto;overflow:auto;padding:20px;border-radius:28px;background:#fff;box-shadow:0 35px 100px rgba(3,20,49,.35)}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.sheet h2{margin:0;font-size:25px}.sheet p{color:var(--muted);line-height:1.5}.close{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px;margin-top:11px;color:var(--muted);font-size:11px;font-weight:800}.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fbfdff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#76aee3;box-shadow:0 0 0 4px rgba(22,116,209,.08)}.sheet-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.tool-list{display:grid;gap:9px}.tool{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#fbfdff}.tool b{display:block;font-size:13px}.tool small{display:block;margin-top:4px;color:var(--muted);font-size:9px}.tool button{flex:none}.diag{padding:13px;border-radius:15px;background:#edf5ff;color:#315474;font:700 10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .empty{padding:25px;border:1px dashed #bcd0e4;border-radius:20px;background:#f8fbff;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:110px;z-index:300;transform:translate(-50%,18px);padding:11px 15px;border-radius:999px;background:#082a5c;color:#fff;font-size:11px;font-weight:850;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    body.dark{--ink:#edf5ff;--muted:#99acc0;--line:#203750;--bg:#06101f;--panel:#0b1a2d;background:#06101f;color:var(--ink)}body.dark .topbar,body.dark .bottom-nav{background:rgba(8,22,39,.95)}body.dark .icon-btn,body.dark .sheet{background:#0d1e32;color:var(--ink)}body.dark .metric,body.dark .section,body.dark .item,body.dark .group,body.dark .report-card,body.dark .field input,body.dark .field select,body.dark .tool{background:#0d1e32;color:var(--ink)}body.dark .item,body.dark .group,body.dark .report-card,body.dark .tool{border-color:#203750}body.dark .bottom-nav button.active{background:#402811}
    @media(max-width:720px){main{padding-left:14px;padding-right:14px}.hero-grid{grid-template-columns:1fr}.ring{width:150px;height:150px}.ring:before{width:112px;height:112px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.group-grid,.report-grid{grid-template-columns:1fr}.options-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.goal-card{grid-template-columns:1fr}.goal-pct{font-size:38px}.form-grid{grid-template-columns:1fr}.brand strong{font-size:20px}.topbar{padding:13px 14px}.top-actions{gap:6px}.icon-btn{width:45px;height:45px}.page-head h1{font-size:34px}}
  </style>
</head>
<body>
  <header class="topbar">
    <button class="brand" type="button" data-route="home" aria-label="Ir al inicio"><span class="logo">FF</span><span><strong>FinanzasFácil</strong><small>Mi Plan</small></span></button>
    <div class="top-actions">
      <button class="icon-btn" type="button" data-action="theme" aria-label="Cambiar apariencia">◐</button>
      <button class="icon-btn" type="button" data-action="tools" aria-label="Abrir herramientas">⚙</button>
      <button class="icon-btn primary" type="button" data-action="add-item" aria-label="Añadir elemento">＋</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="bottom-nav" aria-label="Navegación principal">
    <button type="button" data-route="home"><span>⌂</span>Inicio</button>
    <button type="button" data-route="wealth"><span>▦</span>Patrimonio</button>
    <button type="button" data-route="goals"><span>◎</span>Objetivos</button>
    <button type="button" data-route="options"><span>◉</span>Opciones</button>
    <button type="button" data-route="report"><span>✦</span>Informe</button>
  </nav>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="restoreInput" type="file" accept="application/json" hidden>
  <script>
  (()=>{
    'use strict';
    const VERSION='15.16-stable';
    const PLAN_KEY='ff_mi_plan_v2';
    const TYPE_META={cash:['Cuentas y efectivo','€'],funds:['Fondos / ETF','◫'],stocks:['Acciones','↗'],options:['Opciones','◎'],crypto:['Criptomonedas','◇'],pension:['Planes de pensiones','◌'],realestate:['Inmuebles','⌂'],other:['Otros activos','＋'],debt:['Hipotecas / deuda','−']};
    const FINANCIAL=new Set(['cash','funds','stocks','options','crypto','pension']);
    const LIQUID=new Set(['cash']);
    const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const read=(k,f=null)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(_){return f}};
    const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}};
    const n=v=>Number.isFinite(Number(v))?Number(v):0;
    const euro=(v,d=0)=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n(v));
    const pct=(v,d=0)=>`${new Intl.NumberFormat('es-ES',{maximumFractionDigits:d}).format(n(v))} %`;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    const now=()=>new Date().toISOString();
    function defaultPlan(){return{version:2,onboardingComplete:true,profile:{name:'Luis',detail:'advanced',reviewFrequency:'weekly'},goal:{type:'wealth',name:'Construir mi patrimonio',target:500000,current:0,linkedToNetWorth:true,monthlyContribution:0,deadline:''},items:[],movements:[],rules:{minLiquidityPct:30,maxConcentrationPct:25},preferences:{hideSensitive:false},lastUpdated:now()}}
    function loadPlan(){const raw=read(PLAN_KEY,null)||read('ff_mi_plan_v4',null)||defaultPlan();const base=defaultPlan();return{...base,...raw,profile:{...base.profile,...(raw.profile||{})},goal:{...base.goal,...(raw.goal||{})},rules:{...base.rules,...(raw.rules||{})},preferences:{...base.preferences,...(raw.preferences||{})},items:Array.isArray(raw.items)?raw.items:[],movements:Array.isArray(raw.movements)?raw.movements:[]}}
    let plan=loadPlan();let route='home';let editingId=null;
    function save(msg){plan.lastUpdated=now();write(PLAN_KEY,plan);if(msg)toast(msg)}
    function totals(){const assets=plan.items.filter(x=>x.type!=='debt'),debts=plan.items.filter(x=>x.type==='debt');const gross=assets.reduce((s,x)=>s+n(x.value),0),debt=debts.reduce((s,x)=>s+n(x.value),0),net=gross-debt;const financial=assets.filter(x=>FINANCIAL.has(x.type)),financialAssets=financial.reduce((s,x)=>s+n(x.value),0),cash=assets.filter(x=>LIQUID.has(x.type)).reduce((s,x)=>s+n(x.value),0);const largest=financial.reduce((m,x)=>Math.max(m,n(x.value)),0);const passive=assets.reduce((s,x)=>s+n(x.monthlyIncome),0);const monthKey=new Date().toISOString().slice(0,7);const month=plan.movements.filter(x=>String(x.date||'').slice(0,7)===monthKey);const monthChange=month.reduce((s,x)=>s+(x.kind==='withdrawal'?-n(x.amount):n(x.amount)),0);return{gross,debt,net,financialAssets,cash,liquidity:financialAssets?cash/financialAssets*100:0,concentration:financialAssets?largest/financialAssets*100:0,passive,monthChange}}
    function optionsData(){const shared=read('ff_ibkr_shared_v156',null);const safe=read('ff_options_safe_v9',null);const opt=shared?.options||{};const summary=safe?.summary||{};const trades=Array.isArray(safe?.trades)?safe.trades:[];const open=Array.isArray(safe?.open)?safe.open:[];const realized=n(opt.realized||summary.realized||trades.reduce((s,x)=>s+n(x.realized),0));const months=n(opt.months)||1;return{available:Boolean(shared||safe),provider:shared?.provider||'Interactive Brokers',file:shared?.file?.name||summary.file||safe?.imports?.at(-1)?.name||'',period:shared?.period?.label||'',nav:n(shared?.nav),realized,monthly:n(opt.monthlyAverage)||(months?realized/months:0),trades:n(opt.tradesCount||summary.tradeCount||trades.length),open:n(opt.openCount||summary.openCount||open.length),exposure:n(opt.assignmentExposure||summary.assignmentExposure),unrealized:n(opt.unrealized||summary.unrealized),cash:n(shared?.cash),stockExposure:n(shared?.stockExposure)}}
    const display=v=>plan.preferences.hideSensitive?'••••':v;
    function score(t){let s=40;if(plan.items.length)s+=15;if(t.cash>0)s+=10;if(t.liquidity>=n(plan.rules.minLiquidityPct))s+=10;if(t.concentration<=n(plan.rules.maxConcentrationPct)||!t.financialAssets)s+=10;if(plan.movements.length)s+=8;if(optionsData().available)s+=7;return Math.min(100,s)}
    function dateLabel(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date()).toUpperCase()}
    function greeting(){const h=new Date().getHours();return h<13?'Buenos días':h<20?'Buenas tardes':'Buenas noches'}
    function homeView(){const t=totals(),s=score(t),name=plan.profile.name||'Luis';return `<div class="page-head"><div><p class="date">${esc(dateLabel())}</p><h1>${greeting()}, ${esc(name)}.</h1><p>Una fotografía rápida de tu patrimonio, objetivos e ingresos.</p></div></div><section class="hero"><div class="hero-grid"><div><span class="hero-badge"><i></i>${s>=80?'BUEN CONTROL':s>=60?'EN CONSTRUCCIÓN':'FALTA INFORMACIÓN'}</span><h2>${display(euro(t.net))}</h2><p>Patrimonio neto estimado. Activos ${display(euro(t.gross))} menos deudas ${display(euro(t.debt))}.</p></div><div class="ring" style="--p:${s}"><div><span>Índice de control</span><strong>${s}</strong><small>${s>=80?'Buen control':'En construcción'}</small></div></div></div></section><div class="metrics"><div class="metric"><span>Liquidez</span><strong>${pct(t.liquidity,1)}</strong><small>Regla personal: ${pct(plan.rules.minLiquidityPct)}</small></div><div class="metric"><span>Concentración</span><strong>${pct(t.concentration,1)}</strong><small>Límite: ${pct(plan.rules.maxConcentrationPct)}</small></div><div class="metric"><span>Ingresos pasivos</span><strong>${display(euro(t.passive))}</strong><small>Estimación mensual</small></div><div class="metric"><span>Cambio del mes</span><strong>${display(euro(t.monthChange))}</strong><small>Movimientos registrados</small></div></div>${quickCategories()}`}
    function quickCategories(){const groups=Object.keys(TYPE_META).map(type=>{const items=plan.items.filter(x=>x.type===type);if(!items.length)return'';const total=items.reduce((s,x)=>s+n(x.value),0);return `<div class="group"><div class="group-top"><h3>${TYPE_META[type][1]} ${esc(TYPE_META[type][0])}</h3><strong>${display(euro(total))}</strong></div><p>${items.length} ${items.length===1?'elemento':'elementos'} registrados.</p></div>`}).join('');return `<section class="section"><div class="section-head"><div><h2>Tu situación de un vistazo</h2><p>Las categorías se leen directamente de los datos guardados en este dispositivo.</p></div><button class="soft-btn" data-route="wealth">Ver patrimonio</button></div><div class="group-grid">${groups||'<div class="empty">Todavía no hay elementos patrimoniales.</div>'}</div></section>`}
    function wealthView(){const t=totals();const items=plan.items.map(item=>`<div class="item"><span class="item-icon">${TYPE_META[item.type]?.[1]||'•'}</span><span><b>${esc(item.name||TYPE_META[item.type]?.[0]||'Elemento')}</b><small>${esc(TYPE_META[item.type]?.[0]||item.type)}${item.owner?` · ${esc(item.owner)}`:''}${n(item.monthlyIncome)?` · ${euro(item.monthlyIncome)}/mes`:''}</small></span><span class="item-value"><strong>${item.type==='debt'?'− ':''}${display(euro(item.value))}</strong><button type="button" data-action="edit-item" data-id="${esc(item.id)}">Editar</button></span></div>`).join('');return `<div class="page-head"><div><p class="eyebrow">PATRIMONIO</p><h1>Todo lo que tienes y debes.</h1><p>Los elementos pueden corregirse sin repetir el onboarding.</p></div><button class="primary-btn" data-action="add-item">＋ Añadir</button></div><div class="metrics"><div class="metric"><span>Activos</span><strong>${display(euro(t.gross))}</strong></div><div class="metric"><span>Deudas</span><strong>${display(euro(t.debt))}</strong></div><div class="metric"><span>Patrimonio neto</span><strong>${display(euro(t.net))}</strong></div><div class="metric"><span>Elementos</span><strong>${plan.items.length}</strong></div></div><section class="section"><div class="section-head"><div><h2>Elementos registrados</h2><p>Toca Editar para ajustar una cifra o eliminar un elemento.</p></div></div><div class="item-list">${items||'<div class="empty">No hay elementos todavía.</div>'}</div></section>`}
    function goalsView(){const t=totals(),g=plan.goal||{},current=g.linkedToNetWorth?t.net:n(g.current),progress=g.target?Math.max(0,Math.min(100,current/n(g.target)*100)):0;return `<div class="page-head"><div><p class="eyebrow">OBJETIVOS</p><h1>Tu plan, con una cifra clara.</h1><p>El progreso puede vincularse al patrimonio neto o introducirse manualmente.</p></div><button class="soft-btn" data-action="edit-goal">Editar</button></div><section class="goal-card"><div><p class="eyebrow" style="color:#a9c4df">OBJETIVO PRINCIPAL</p><h2>${esc(g.name||'Construir mi patrimonio')}</h2><p>${display(euro(current))} de ${display(euro(g.target))} · aportación ${display(euro(g.monthlyContribution))}/mes</p><div class="goal-progress"><i style="width:${progress}%"></i></div></div><div class="goal-pct">${pct(progress,1)}</div></section><section class="section"><div class="section-head"><div><h2>Reglas personales</h2><p>Son límites elegidos por ti, no recomendaciones de inversión.</p></div></div><div class="group-grid"><div class="group"><div class="group-top"><h3>Liquidez mínima</h3><strong>${pct(plan.rules.minLiquidityPct)}</strong></div><p>La actual es ${pct(t.liquidity,1)}.</p></div><div class="group"><div class="group-top"><h3>Concentración máxima</h3><strong>${pct(plan.rules.maxConcentrationPct)}</strong></div><p>La actual es ${pct(t.concentration,1)}.</p></div></div></section>`}
    function optionsView(){const o=optionsData();if(!o.available)return `<div class="page-head"><div><p class="eyebrow">OPCIONES</p><h1>Tu operativa de opciones.</h1><p>Esta pantalla no ha encontrado todavía datos guardados del CSV de Interactive Brokers.</p></div></div><section class="section"><div class="empty"><b>No hay análisis disponible</b><br>El CSV puede volver a importarse cuando recuperemos el importador completo. El resto del menú seguirá funcionando.</div></section>`;return `<div class="page-head"><div><p class="eyebrow">OPCIONES</p><h1>Tu estrategia de opciones.</h1><p>Lectura inmediata desde el análisis de Interactive Brokers ya guardado.</p></div></div><section class="options-hero"><div class="file">${esc(o.provider)}${o.file?` · ${esc(o.file)}`:''}${o.period?` · ${esc(o.period)}`:''}</div><h2>${display(euro(o.realized,2))} realizados</h2><p style="color:#a9c2da;margin:0">Resultado bruto del periodo, antes de ajustes por acciones asignadas y ciclos abiertos.</p><div class="options-grid"><div class="option-kpi"><span>NAV DE LA CUENTA</span><strong>${display(euro(o.nav,2))}</strong></div><div class="option-kpi"><span>MEDIA MENSUAL</span><strong>${display(euro(o.monthly,2))}</strong></div><div class="option-kpi"><span>OPERACIONES</span><strong>${o.trades}</strong></div><div class="option-kpi"><span>POSICIONES ABIERTAS</span><strong>${o.open}</strong></div><div class="option-kpi"><span>PUTS ABIERTAS</span><strong>${display(euro(o.exposure))}</strong></div><div class="option-kpi"><span>NO REALIZADO</span><strong>${display(euro(o.unrealized,2))}</strong></div></div></section><div class="notice"><b>Sin doble conteo:</b> el NAV de Interactive Brokers forma parte del patrimonio una sola vez. Las opciones son el desglose de esa cuenta.</div>`}
    function reportView(){const t=totals();const movements=[...(plan.movements||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,12);return `<div class="page-head"><div><p class="eyebrow">INFORME</p><h1>Tu resumen financiero.</h1><p>Una lectura breve de las cifras guardadas actualmente.</p></div></div><div class="report-grid"><div class="report-card"><span>PATRIMONIO NETO</span><strong>${display(euro(t.net))}</strong></div><div class="report-card"><span>INGRESOS PASIVOS / MES</span><strong>${display(euro(t.passive))}</strong></div><div class="report-card"><span>LIQUIDEZ</span><strong>${pct(t.liquidity,1)}</strong></div><div class="report-card"><span>ÚLTIMA ACTUALIZACIÓN</span><strong style="font-size:15px">${new Intl.DateTimeFormat('es-ES',{dateStyle:'medium',timeStyle:'short'}).format(new Date(plan.lastUpdated||Date.now()))}</strong></div></div><section class="section"><div class="section-head"><div><h2>Últimos movimientos</h2><p>Aportaciones, retiradas, mercado e ingresos pasivos.</p></div><button class="soft-btn" data-action="add-movement">＋ Movimiento</button></div>${movements.length?movements.map(m=>`<div class="movement"><span><b>${esc({contribution:'Aportación',market:'Mercado',withdrawal:'Retirada',income:'Ingreso pasivo'}[m.kind]||'Movimiento')}</b><small>${esc(m.date||'')} ${m.note?`· ${esc(m.note)}`:''}</small></span><strong>${m.kind==='withdrawal'?'−':'＋'}${display(euro(m.amount))}</strong></div>`).join(''):'<div class="empty">No hay movimientos registrados.</div>'}</section>`}
    function render(){plan=loadPlan();const map={home:homeView,wealth:wealthView,goals:goalsView,options:optionsView,report:reportView};$('#view').innerHTML=(map[route]||homeView)();$$('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));window.scrollTo({top:0,behavior:'instant'})}
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
    function openModal(html){$('#modalRoot').innerHTML=`<div class="overlay" data-action="close-overlay"><section class="sheet" role="dialog" aria-modal="true">${html}</section></div>`}
    function closeModal(){$('#modalRoot').innerHTML='';editingId=null}
    function itemModal(id=null){editingId=id;const item=id?plan.items.find(x=>x.id===id):{id:uid(),name:'',type:'cash',value:0,monthlyIncome:0,owner:'Familiar'};if(!item)return;openModal(`<div class="sheet-head"><div><p class="eyebrow">PATRIMONIO</p><h2>${id?'Editar elemento':'Añadir elemento'}</h2></div><button class="close" data-action="close-modal">×</button></div><form id="itemForm"><label class="field">Nombre<input id="fName" value="${esc(item.name)}" required placeholder="Ej. Interactive Brokers"></label><div class="form-grid"><label class="field">Tipo<select id="fType">${Object.entries(TYPE_META).map(([k,v])=>`<option value="${k}" ${item.type===k?'selected':''}>${esc(v[0])}</option>`).join('')}</select></label><label class="field">Valor actual (€)<input id="fValue" type="number" min="0" step="0.01" value="${n(item.value)}" required></label></div><div class="form-grid"><label class="field">Ingreso mensual (€)<input id="fIncome" type="number" min="0" step="0.01" value="${n(item.monthlyIncome)}"></label><label class="field">Titular<input id="fOwner" value="${esc(item.owner||'')}" placeholder="Personal, pareja, familiar"></label></div><div class="sheet-actions">${id?'<button type="button" class="danger-btn" data-action="delete-item">Eliminar</button>':''}<button type="button" class="soft-btn" data-action="close-modal">Cancelar</button><button type="submit" class="primary-btn">Guardar</button></div></form>`)}
    function goalModal(){const g=plan.goal;openModal(`<div class="sheet-head"><div><p class="eyebrow">OBJETIVO</p><h2>Editar mi plan</h2></div><button class="close" data-action="close-modal">×</button></div><form id="goalForm"><label class="field">Nombre<input id="gName" value="${esc(g.name)}" required></label><div class="form-grid"><label class="field">Meta (€)<input id="gTarget" type="number" min="1" value="${n(g.target)}" required></label><label class="field">Aportación mensual (€)<input id="gContribution" type="number" min="0" value="${n(g.monthlyContribution)}"></label></div><label class="field">Progreso manual (€)<input id="gCurrent" type="number" min="0" value="${n(g.current)}"></label><label class="field" style="grid-template-columns:auto 1fr;align-items:center"><input id="gLinked" type="checkbox" ${g.linkedToNetWorth?'checked':''} style="width:22px;min-height:22px"> Vincular progreso al patrimonio neto</label><div class="sheet-actions"><button type="button" class="soft-btn" data-action="close-modal">Cancelar</button><button type="submit" class="primary-btn">Guardar</button></div></form>`)}
    function movementModal(){openModal(`<div class="sheet-head"><div><p class="eyebrow">MOVIMIENTO</p><h2>Actualizar el mes</h2></div><button class="close" data-action="close-modal">×</button></div><form id="movementForm"><div class="form-grid"><label class="field">Tipo<select id="mKind"><option value="contribution">Aportación</option><option value="market">Mercado / revalorización</option><option value="withdrawal">Retirada o gasto</option><option value="income">Ingreso pasivo</option></select></label><label class="field">Importe (€)<input id="mAmount" type="number" min="0" step="0.01" required></label></div><div class="form-grid"><label class="field">Fecha<input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label class="field">Nota<input id="mNote" maxlength="80" placeholder="Opcional"></label></div><div class="sheet-actions"><button type="button" class="soft-btn" data-action="close-modal">Cancelar</button><button type="submit" class="primary-btn">Registrar</button></div></form>`)}
    function toolsModal(){const stores=['ff_mi_plan_v2','ff_ibkr_shared_v156','ff_options_safe_v9','ff_onboarding_brokers_v155','ff_properties_v1512','ff_income_sources_v1510'];const present=stores.map(k=>`${localStorage.getItem(k)?'✓':'○'} ${k}`).join('\n');openModal(`<div class="sheet-head"><div><p class="eyebrow">HERRAMIENTAS</p><h2>Datos y configuración</h2></div><button class="close" data-action="close-modal">×</button></div><div class="tool-list"><div class="tool"><span><b>${plan.preferences.hideSensitive?'Mostrar importes':'Ocultar importes'}</b><small>Cambia únicamente la visualización.</small></span><button class="soft-btn" data-action="toggle-sensitive">${plan.preferences.hideSensitive?'Mostrar':'Ocultar'}</button></div><div class="tool"><span><b>Exportar copia</b><small>Descarga todos los datos locales en JSON.</small></span><button class="soft-btn" data-action="export">Exportar</button></div><div class="tool"><span><b>Restaurar copia</b><small>Importa una copia previamente descargada.</small></span><button class="soft-btn" data-action="restore">Importar</button></div><div class="tool"><span><b>Recargar datos</b><small>Vuelve a leer el almacenamiento sin borrar nada.</small></span><button class="soft-btn" data-action="reload-data">Recargar</button></div><div class="diag">FinanzasFácil ${VERSION}\n${present}</div></div>`)}
    function exportData(){const keys=[];for(let i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));const payload={version:VERSION,exportedAt:now(),origin:location.origin,data:Object.fromEntries(keys.filter(Boolean).map(k=>[k,localStorage.getItem(k)]))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`finanzasfacil-copia-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Copia exportada')}
    document.addEventListener('click',e=>{const routeBtn=e.target.closest('[data-route]');if(routeBtn){route=routeBtn.dataset.route;render();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='close-overlay'&&e.target===a)closeModal();if(action==='close-modal')closeModal();if(action==='add-item')itemModal();if(action==='edit-item')itemModal(a.dataset.id);if(action==='edit-goal')goalModal();if(action==='add-movement')movementModal();if(action==='tools')toolsModal();if(action==='theme'){document.body.classList.toggle('dark');localStorage.setItem('ff_stable_theme',document.body.classList.contains('dark')?'dark':'light')}if(action==='delete-item'&&editingId){plan.items=plan.items.filter(x=>x.id!==editingId);save('Elemento eliminado');closeModal();render()}if(action==='toggle-sensitive'){plan.preferences.hideSensitive=!plan.preferences.hideSensitive;save();closeModal();render()}if(action==='export')exportData();if(action==='restore')$('#restoreInput').click();if(action==='reload-data'){plan=loadPlan();closeModal();render();toast('Datos recargados')}});
    document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='itemForm'){const existing=editingId?plan.items.find(x=>x.id===editingId):null;const item={...(existing||{id:uid()}),name:$('#fName').value.trim(),type:$('#fType').value,value:n($('#fValue').value),monthlyIncome:n($('#fIncome').value),owner:$('#fOwner').value.trim(),updatedAt:now()};if(existing)Object.assign(existing,item);else plan.items.push(item);save('Elemento guardado');closeModal();render()}if(e.target.id==='goalForm'){plan.goal={...plan.goal,name:$('#gName').value.trim(),target:n($('#gTarget').value),monthlyContribution:n($('#gContribution').value),current:n($('#gCurrent').value),linkedToNetWorth:$('#gLinked').checked};save('Objetivo guardado');closeModal();render()}if(e.target.id==='movementForm'){plan.movements.push({id:uid(),kind:$('#mKind').value,amount:n($('#mAmount').value),date:$('#mDate').value,note:$('#mNote').value.trim()});save('Movimiento registrado');closeModal();render()}});
    $('#restoreInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const payload=JSON.parse(await file.text());if(!payload?.data||typeof payload.data!=='object')throw new Error('Formato no válido');Object.entries(payload.data).forEach(([k,v])=>{if(typeof v==='string')localStorage.setItem(k,v)});plan=loadPlan();closeModal();render();toast('Copia restaurada')}catch(err){toast('No se pudo restaurar la copia')}});
    if(localStorage.getItem('ff_stable_theme')==='dark')document.body.classList.add('dark');
    render();
  })();
  </script>
</body>
</html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082a5c"><title>Mi Plan — versión estable</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#eef5ff;color:#082a5c}main{min-height:100vh;display:grid;place-items:center}.load{text-align:center}.spin{width:42px;height:42px;border:4px solid #dce8fa;border-top-color:#ff7a16;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main id="boot"><div class="load"><h2>Abriendo Mi Plan</h2><div class="spin"></div><p>Versión estable para Safari</p></div></main><script>(async()=>{try{const r=await fetch('./index.html?stable=9&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No se pudo descargar la aplicación');let h=await r.text();h=h.replace('./portrait-v4-loader.js?v=4','./safe-loader-v9.js?v=9');h=h.replace('</head>','<meta name="ff-release" content="9"></head>');document.open();document.write(h);document.close()}catch(e){document.getElementById('boot').innerHTML='<div class="load"><h2>No se pudo abrir</h2><p>Vuelve atrás y prueba de nuevo.</p></div>'}})();</script></body></html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <meta name="application-name" content="Portfolio">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07111f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=4">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
    .selector{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:6px;background:rgba(2,6,23,.70);border:1px solid rgba(125,211,252,.25);border-radius:999px;backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.25)}
    button{border:0;border-radius:999px;padding:9px 14px;background:transparent;color:#cbd5e1;font-weight:800;font-size:13px;cursor:pointer;}
    button.active{background:linear-gradient(90deg,rgba(52,211,153,.28),rgba(34,211,238,.25));color:white;box-shadow:0 0 0 1px rgba(125,211,252,.25) inset;}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f;}
    @media(max-width:560px){.selector{top:calc(env(safe-area-inset-top) + 7px)}button{padding:8px 12px;font-size:12px}}
  </style>
</head>
<body>
  <div class="selector">
    <button id="btnLuis" class="active" onclick="setUser('luis')">Luis</button>
    <button id="btnDanito" onclick="setUser('danito')">Danito</button>
  </div>
  <iframe id="dash" src="/latest" title="Portfolio dashboard"></iframe>
  <script>
    const routes={luis:'/latest',danito:'/dashboard-danito-2026-05-22/'};
    function setUser(user){
      localStorage.setItem('portfolioUser',user);
      document.getElementById('dash').src=routes[user];
      document.getElementById('btnLuis').classList.toggle('active',user==='luis');
      document.getElementById('btnDanito').classList.toggle('active',user==='danito');
    }
    setUser(localStorage.getItem('portfolioUser')||'luis');
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luis Portfolio Control</title>
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <meta name="application-name" content="Portfolio">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07111f">
  <link rel="manifest" href="/manifest.webmanifest?v=20260828a">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=4">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f}
  </style>
</head>
<body>
  <iframe id="dash" src="/index.html?v=20260828a" title="Luis Portfolio Control" allow="web-share"></iframe>
  <script>
    const dash=document.getElementById('dash');
    dash.addEventListener('load',()=>{
      try{
        const doc=dash.contentDocument;
        if(!doc) return;
        if(!doc.getElementById('investorQuotesScript')){
          const quotes=doc.createElement('script');
          quotes.id='investorQuotesScript';
          quotes.src='/share-investor-quotes.js?v=20260828a';
          doc.body.appendChild(quotes);
        }
        if(!doc.getElementById('interactiveWeeklyScript')){
          const interactive=doc.createElement('script');
          interactive.id='interactiveWeeklyScript';
          interactive.src='/interactive-weekly.js?v=20260828a';
          doc.body.appendChild(interactive);
        }
      }catch(error){console.error('No se pudieron cargar las mejoras del dashboard',error);}
    });
  </script>
</body>
</html>
